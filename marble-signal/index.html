body{display:grid;place-items:center}.dither-text-frame{width:min(100vw,calc(100dvh * 1.7777777777777777));height:min(100dvh,calc(100vw * 0.5625))}

<body>
<div class="dither-text-frame"><canvas class="dither-text-canvas" role="img" aria-label="Dither rendering of the source media"></canvas></div>
<script type="module">
/**
 * Where a source image lands inside a target box.
 *
 * Twelve texture engines each carried their own copy of the same
 * `Math.min(w / sw, h / sh)` plus centred offsets. This is that formula, once,
 * with the other half of the choice available: `contain` fits the whole source
 * and leaves margins, `cover` fills the box and crops the overflow.
 *
 * The return value is both halves of a nine-argument `drawImage`. `source` is
 * the region to read out of the image and `dest` is where it goes in the box,
 * so contain reads the whole image into a smaller centred rect and cover reads
 * a centred crop into the whole box. Engines that sample into a scratch grid
 * scale `dest` into grid space and pass `source` through untouched.
 */
/**
 * The fit a texture should use. Previews and exports share it, so what the
 * catalogue shows is what the file contains.
 *
 * `cover` is the default because a texture is bought for the effect, not for
 * the demo photograph's composition, and a catalogue only reads as a grid when
 * every tile is the same size. A look that needs its whole frame can opt back
 * out with `sourceFit: 'contain'` in its config.
 */
function sourceFit(config) {
  return config?.sourceFit === 'contain' ? 'contain' : 'cover';
}

function frameSource(width, height, sourceWidth, sourceHeight, mode = 'contain') {
  const w = Math.max(1, Number(width) || 1);
  const h = Math.max(1, Number(height) || 1);
  const sw = Math.max(1, Number(sourceWidth) || 1);
  const sh = Math.max(1, Number(sourceHeight) || 1);

  if (mode === 'cover') {
    const scale = Math.max(w / sw, h / sh);
    // Clamped because a rounding error that asks for more pixels than the image
    // has makes drawImage sample the transparent edge instead of the picture.
    const cropW = Math.min(sw, w / scale);
    const cropH = Math.min(sh, h / scale);
    return {
      source: { x: (sw - cropW) / 2, y: (sh - cropH) / 2, width: cropW, height: cropH },
      dest: { x: 0, y: 0, width: w, height: h }
    };
  }

  const scale = Math.min(w / sw, h / sh);
  const dw = sw * scale;
  const dh = sh * scale;
  return {
    source: { x: 0, y: 0, width: sw, height: sh },
    dest: { x: (w - dw) / 2, y: (h - dh) / 2, width: dw, height: dh }
  };
}

// The small canvas a texture renderer reads its source through. Assigning a
// canvas's width or height, even the size it already has, throws its bitmap
// away and resets its 2D context, and a look paints its sampler on every frame
// it animates (audit F10). So the size is set only when it changes; at the
// same size the bitmap is cleared and the drawing state the renderers rely on
// is put back by hand, which is all that reset did for them.

/** Sizes `sampler` to `width` x `height` and returns its cleared 2D context in the default state. */
function sizeSampler(sampler, width, height) {
  if (sampler.width !== width || sampler.height !== height) {
    sampler.width = width;
    sampler.height = height;
    return sampler.getContext('2d', { willReadFrequently: true });
  }
  const context = sampler.getContext('2d', { willReadFrequently: true });
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.globalAlpha = 1;
  context.globalCompositeOperation = 'source-over';
  context.filter = 'none';
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = 'low';
  context.shadowBlur = 0;
  context.shadowOffsetX = 0;
  context.shadowOffsetY = 0;
  context.shadowColor = 'rgba(0, 0, 0, 0)';
  context.clearRect(0, 0, width, height);
  return context;
}

// Shared tonal equalisation for the screen-and-glyph engines.
//
// Lives here rather than inside one engine because ASCII and Dither Text hit
// the same wall from opposite directions: one picks a glyph by threshold, the
// other lets a pixel through an ordered gate, and BOTH compare the picture's
// raw luminance against fixed numbers. That makes every preset a preset for the
// one photograph it was authored on.

// Prefixed rather than named `luminance`/`clamp01`: the standalone export
// builders concatenate this module's source ahead of the engine's into one
// script, and both engines already declare those two names at top level.
//
// Rec. 709. The eye reads ink coverage as brightness, so perceptual luminance —
// not the arithmetic mean of the channels — is what keeps a saturated red from
// being screened like the mid grey it is nowhere near in apparent lightness.
const toneLuminance = (r, g, b) => (0.212599 * r + 0.715199 * g + 0.0721999 * b) / 255;
const toneClamp01 = (n) => (n < 0 ? 0 : n > 1 ? 1 : n);

/**
 * The value that asks for the strength to be read off the picture itself.
 * Controls expose it as the slider's lowest stop, below `0`, so the setting a
 * visitor lands on is the one that adapts and the numbers above it are the
 * manual override.
 */
const AUTO_LEVEL = 'auto';

// Where the ramp opens and closes, measured on the 98th percentile of the
// picture's luminance — the brightest tone that is a population rather than a
// speck. Those two numbers are the whole judgement, so they are written down
// with the evidence that set them (2026-09-22, 95 captures across the 19
// published textures and an exposure ladder cut from the shipped photograph).
//
// p98 is the statistic that survived, and it beat the obvious candidates for a
// reason: it is the only one that also gets a LIT SUBJECT ON BLACK right. The
// median, the mean and the tonal range all read that frame as starved — it is
// overwhelmingly black — and would have equalised a photograph that renders
// perfectly today, lifting its background into mush. p98 sees the highlight on
// the subject and leaves it alone. Measured: that frame scores p98 0.878, the
// same as the well-exposed control, while -1.5 EV sits at 0.310 and -3 EV at
// 0.110. Dark BACKGROUNDS were never the fault; crushed HIGHLIGHTS are.
const HIGHLIGHT_LIT = 0.550001; // a picture with highlights here needs no help
const HIGHLIGHT_STARVED = 0.249999; // nothing this side of shadow: equalise fully

// The same judgement mirrored onto the other end, on the 2nd percentile.
//
// A washed-out or faded upload is the dark frame's twin: its highlights are
// fine, so p98 waves it through, but it has no shadows left, and a gate that
// inks the dark end (or the light end, once inverted) finds almost nothing on
// one side of it. Measured 2026-09-26 on the Cobalt Plate preset: a high-key
// frame (p02 0.784) under Auto inked 82.6% of the screen and the subject
// dissolved into the ground, a faded print (p02 0.451) 64%.
//
// And as with p98, the percentile is what keeps the mirrored easy case right:
// a SUBJECT ON WHITE is overwhelmingly white, but its p02 sits on the subject
// (0.165) and it is left alone. The opening is set above every published
// source that renders under Auto — contour-map's plate is the highest at p02
// 0.282 — so no look in the catalogue moves; only lifted uploads do.
const SHADOW_DEEP = 0.299999; // a picture with blacks down here needs no help
const SHADOW_LIFTED = 0.599999; // nothing this side of a midtone: equalise fully

/**
 * How hard to equalise a picture that did not ask for a number.
 *
 * Zero for anything with highlights and shadows to spare, so a well-exposed
 * upload renders exactly as it does today, and rising smoothly as either end
 * collapses — the top end of a dark frame, the bottom end of a washed one. The
 * curve between is a smoothstep rather than a line: a visitor nudging exposure
 * across the opening of the ramp should not see the texture step.
 *
 * @param {(fraction: number) => number} at percentile lookup over the picture
 * @returns {number} 0..1 strength for {@link autoLevelBands}
 */
function autoLevelStrength(at) {
  const smoothstep = (t) => t * t * (3 - 2 * t);
  const starved = toneClamp01((HIGHLIGHT_LIT - at(0.979999)) / (HIGHLIGHT_LIT - HIGHLIGHT_STARVED));
  const lifted = toneClamp01((at(0.02) - SHADOW_DEEP) / (SHADOW_LIFTED - SHADOW_DEEP));
  // Whichever end has collapsed further decides; a frame cannot be both.
  return smoothstep(Math.max(starved, lifted));
}

/**
 * Maps the picture's own tonal distribution onto the effect's fixed thresholds.
 *
 * Those thresholds are absolute — an ASCII ramp `'■▪·  '` changes glyph at
 * 0.125, 0.375 and 0.625, a Bayer gate compares against its matrix — whatever
 * the picture is, so a preset tuned on one photograph is tuned for that
 * photograph only. Measured over five unrelated images, one ASCII preset inked
 * between 38% and 85% of the grid: a bright picture came out nearly bare, a
 * dark one filled solid. The three Dither Text looks published on 2026-09-20
 * measured the same failure on the same five images, swinging 0.41 to 0.87 in
 * coverage and filling 87-93% of the frame on a near-black source.
 *
 * Stretching the picture's percentile range onto 0..1 does not fix that, and
 * the same five images proved it — the swing stayed at 0.49, because what
 * decides how much ink falls is the SHAPE of the histogram, not its width. A
 * dark-dominant photograph keeps most of its pixels under the threshold however
 * far you stretch it.
 *
 * So this returns the picture's cumulative distribution instead: read a
 * luminance, get back the fraction of the picture that is darker than it. That
 * makes the values uniform by construction, and ink coverage becomes a property
 * of the ramp or the gate — the share of it that is not blank — rather than of
 * whatever the visitor happened to upload. `amount` blends back toward the raw
 * tone, so a look can keep some of the original tonal character.
 *
 * A curve alone is not enough, and the two engines proved it from opposite
 * sides. Equalisation sends every pixel of one input tone to a single output
 * tone, so a photograph dominated by ONE tone — a subject on a white studio
 * sweep, a subject on black, a flat sky — collapses its whole background onto
 * a single point mid-range. Dither Text survives that because its Bayer and
 * halftone gates compare each pixel against an ordered matrix, which spreads
 * the tie out spatially by construction. ASCII picks a glyph by plain
 * threshold, so the collapsed mass lands wholly inside one ramp slot; when that
 * slot is part of the ramp's blank run the texture does not merely weaken, it
 * disappears and the raw photograph shows through. Measured 2026-09-21: a raven
 * on white rendered ZERO glyphs under `code-mist`, a horse on black zero under
 * `arena-glyph`.
 *
 * So `span` reports how wide a band each input tone earns — its share of the
 * picture. A caller that has an ordered matrix to hand offsets within that band
 * (`curve[i] + span[i] * (ordered - 0.5)`) and the flat mass is rendered as a
 * screen across the range it deserves instead of a single collapsed step. Ink
 * coverage is unchanged, because the band is still occupied uniformly over
 * pixels; what changes is that the ink lands.
 *
 * @param {Uint8ClampedArray} data RGBA pixels of a downsampled probe of the source
 * @param {number|'auto'} amount 0 = identity curve, 1 = full equalisation,
 *   `'auto'` = read the strength off the picture's own highlights and shadows
 * @returns {{curve: Float32Array, span: Float32Array, level?: number}} 256-entry
 *   lookup from 8-bit luminance to 0..1 tone, the width of the band each tone
 *   earns, and (only when the picture was equalised) the strength used, so a
 *   caller can scale its own correction by how far the curve moved
 */
function autoLevelBands(data, amount = 1) {
  const auto = amount === AUTO_LEVEL;
  const asked = auto ? 1 : toneClamp01(Number(amount) || 0);
  const identity = Float32Array.from({ length: 256 }, (_, i) => i / 255);
  const flat = new Float32Array(256);
  // An explicit zero is the pinned presets' hot path — no histogram, no scan.
  if (!auto && asked <= 0) return { curve: identity, span: flat };
  const histogram = new Uint32Array(256);
  let counted = 0;
  for (let i = 0; i < data.length; i += 4) {
    // Contain margins are transparent and carry no picture; letting them vote
    // would tell the curve that a third of every non-16:9 source is black.
    if (data[i + 3] === 0) continue;
    histogram[Math.round(toneLuminance(data[i], data[i + 1], data[i + 2]) * 255)] += 1;
    counted += 1;
  }
  if (!counted) return { curve: identity, span: flat };
  const at = (fraction) => {
    const target = fraction * counted;
    let seen = 0;
    for (let i = 0; i < 256; i += 1) { seen += histogram[i]; if (seen >= target) return i / 255; }
    return 1;
  };
  // A picture with no range to speak of — a mark on one flat colour, a fogged
  // frame — has a CDF that is a single step, and equalising it turns sensor
  // noise into a full-contrast dot storm. Leave those alone.
  //
  // Narrow range alone is not that test, though, and a badly underexposed
  // photograph is what proves it: at -4.5 EV the shipped source spans 0.031,
  // inside the cutoff, while still holding eleven populated levels of real
  // subject. Refusing it was a cliff in the wrong direction — -3 EV equalised
  // fully and the DARKER frame got nothing — so the frames this rejects must
  // also be the ones with nowhere to spread: a lens cap occupies three levels,
  // that photograph eleven.
  const populated = histogram.reduce((n, count) => n + (count / counted >= 0.00200001 ? 1 : 0), 0);
  if (at(0.98) - at(0.02) < 0.0499999 && populated < 6) return { curve: identity, span: flat };
  // Only now, with the histogram in hand, does `'auto'` become a number. One
  // scan serves both jobs: deciding whether to act and building what acts.
  const level = auto ? autoLevelStrength(at) : asked;
  if (level <= 0) return { curve: identity, span: flat };
  const curve = new Float32Array(256);
  const span = new Float32Array(256);
  let seen = 0;
  for (let i = 0; i < 256; i += 1) {
    // Centre of the bin's span in the distribution, so a tone that occupies a
    // large share of the picture lands in the middle of the band it earns
    // rather than at its top edge.
    const equalised = (seen + histogram[i] / 2) / counted;
    seen += histogram[i];
    curve[i] = identity[i] + (equalised - identity[i]) * level;
    // The band that same tone earns. Scaled by `level` alongside the curve, so
    // a partial auto-level spreads as gently as it equalises.
    span[i] = (histogram[i] / counted) * level;
  }
  return { curve, span, level };
}

/**
 * The curve alone, for callers with no ordered matrix to spread a band across.
 * @returns {Float32Array} 256-entry lookup from 8-bit luminance to 0..1 tone
 */
function autoLevelCurve(data, amount = 1) {
  return autoLevelBands(data, amount).curve;
}

/**
 * The 256-entry transfer table an engine already builds, with the picture's own
 * distribution folded in underneath it.
 *
 * Ten of the twelve texture engines open the same way — a table from 8-bit
 * input to shaped tone, `Float32Array.from({length: 256}, (_, i) => xTone(i /
 * 255, config))` — and then index it per pixel or per channel. Equalisation
 * belongs exactly there, replacing the raw `i / 255` with what that tone is
 * worth inside THIS picture, which is also why it lands ahead of the
 * brightness/contrast/gamma the shape function applies: those controls then
 * work on a known range instead of hunting for where this photograph sits.
 *
 * @param {Uint8ClampedArray} data RGBA pixels the engine already sampled
 * @param {number|'auto'} amount the engine's `autoLevel` setting
 * @param {(tone: number) => number} shape the engine's existing tone function
 * @returns {Float32Array} 256-entry table, identical to today's at `0`
 */
function autoLevelTable(data, amount, shape) {
  const curve = autoLevelCurve(data, amount);
  return Float32Array.from({ length: 256 }, (_, i) => shape(curve[i]));
}

/**
 * Reads an `autoLevel` setting out of saved state.
 *
 * Kept here rather than in each engine's own `number()` helper because the
 * sentinel has to survive the trip through a shared link and a published
 * config, and twelve normalisers each coercing it to a number is twelve ways
 * for Auto to silently become zero.
 *
 * @param {unknown} value whatever the state carried
 * @param {number|'auto'} fallback the engine's default
 */
function autoLevelSetting(value, fallback = AUTO_LEVEL) {
  if (value === AUTO_LEVEL) return AUTO_LEVEL;
  if (value == null || String(value).trim() === '') return fallback;
  const n = Number(value);
  return Number.isFinite(n) ? toneClamp01(n) : fallback;
}

/**
 * The Tone control every engine that reads raw luminance shares.
 *
 * Spelled once here because twelve copies of the same slider is twelve chances
 * to disagree about its range. `'auto'` is the lowest stop rather than a
 * separate checkbox: the scale then runs from "decide for me" through "leave it
 * alone" to "equalise regardless", which is the order a visitor reaches for.
 */
const AUTO_LEVEL_CONTROL = {
  section: 'Tone',
  kind: 'slider',
  key: 'autoLevel',
  label: 'Auto level',
  min: 0,
  max: 1,
  step: 0.0099999,
  auto: AUTO_LEVEL
};

// Original split-field typography and ordered dithering. No vendor code/assets.

const clamp = n => Math.max(0, Math.min(1, n));
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const BAYER2 = [0, 2, 3, 1];
function bayer(x, y, size) {
  let value = 0;
  for (let bit = 1; bit < size; bit <<= 1) value = value * 4 + BAYER2[((y & bit) ? 2 : 0) + ((x & bit) ? 1 : 0)];
  return (value + 0.5) / (size * size);
}
// Stable source-grid noise: no flicker on redraw or drift between exports.
function grainAt(x, y) {
  let n = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
// Median luminance where the high-key tone (`highKeyLevel`, `highKeyGamma`)
// starts to take over, and where it has taken over fully.
const HIGH_KEY_OPEN = .300001, HIGH_KEY_FULL = .500001;
// `highKeyFrom: 'White backdrop'`: the 8-bit luminance band in which the
// brightest flat tone of the probe starts and finishes counting as white, and
// the share that flat tone has to hold for the high-key tone to start and to
// take over fully.
const WHITE_FROM = 220, WHITE_AT = 230, WHITE_OPEN = .2, WHITE_FULL = .299999;
// The same backdrop lit unevenly (a sweep that falls from 255 to 245 across
// the frame): the share of the frame's edge the plane is fitted on, the
// luminance steps a backdrop pixel may differ from its neighbours two pixels
// away and from the fitted plane, the share the spike of the levelled
// picture has to hold to start and to take over fully, the share of
// the twelve levels under it, against the spike, from which a hill (a white
// room) starts and finishes shutting the blend, and the share of the edge
// that has to lie on the plane to start and to finish opening it.
const SWEEP_RING = .1, SWEEP_STEP = 1, SWEEP_FIT = 2, SWEEP_PASSES = 4, SWEEP_SAMPLES = 50;
const SWEEP_OPEN = .149999, SWEEP_FULL = .249999, SWEEP_HILL = .320001, SWEEP_HILL_SHUT = .399999, SWEEP_PLANE = .499999, SWEEP_PLANE_FULL = .600001;
// Share of the frame left transparent from which `cutoutGround` votes in full.
const CUTOUT_FULL = .250001;
// A 64x64 blue-noise threshold mask, built once by void-and-cluster (Ulichney
// 1993) from a seed pattern drawn with `grainAt`. Each pixel still inks with a
// probability equal to its tone, as with Stardust, but neighbouring thresholds
// are as far apart as possible, so the dots spread evenly at every density
// instead of clumping into the loose dust white noise gives. The Gaussian
// weights are integers, so every energy sum is exact and the ranking (hence
// every dot) is the same in every browser and on every redraw.
const BLUE = 64;
let blueMask = null;
function blueNoiseMask() {
  if (blueMask) return blueMask;
  const area = BLUE * BLUE, radius = 6, kernel = [];
  for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
    kernel.push(dx, dy, Math.round(1e6 * Math.exp(-(dx * dx + dy * dy) / 4.50001)));
  }
  const energy = new Float64Array(area), on = new Uint8Array(area), rank = new Float32Array(area);
  const splat = (i, sign) => {
    const x = i % BLUE, y = (i - x) / BLUE;
    for (let k = 0; k < kernel.length; k += 3) energy[((y + kernel[k + 1] + BLUE) % BLUE) * BLUE + (x + kernel[k] + BLUE) % BLUE] += sign * kernel[k + 2];
  };
  // Tightest cluster: the set pixel with the most energy; largest void: the
  // empty one with the least. Ties go to the lower index.
  const extreme = (state, most) => {
    let best = -1;
    for (let i = 0; i < area; i++) if (on[i] === state && (best < 0 || (most ? energy[i] > energy[best] : energy[i] < energy[best]))) best = i;
    return best;
  };
  let ones = 0;
  for (let i = 0; i < area; i++) if (grainAt(i % BLUE, Math.floor(i / BLUE)) < 0.100001) { on[i] = 1; splat(i, 1); ones++; }
  // Relax the seed until moving its tightest dot into its largest void
  // changes nothing.
  for (let guard = 0; guard < area; guard++) {
    const cluster = extreme(1, true); on[cluster] = 0; splat(cluster, -1);
    const voidAt = extreme(0, false); on[voidAt] = 1; splat(voidAt, 1);
    if (voidAt === cluster) break;
  }
  const seed = on.slice(), seedEnergy = energy.slice();
  for (let r = ones - 1; r >= 0; r--) { const i = extreme(1, true); on[i] = 0; splat(i, -1); rank[i] = r; }
  on.set(seed); energy.set(seedEnergy);
  for (let r = ones; r < area; r++) { const i = extreme(0, false); on[i] = 1; splat(i, 1); rank[i] = r; }
  for (let i = 0; i < area; i++) rank[i] = (rank[i] + 0.5) / area;
  return (blueMask = rank);
}

function ditherGate(x, y, style) {
  if (style === '1-bit threshold') return 0.500001;
  if (style === 'Blue noise') return blueNoiseMask()[(y % BLUE) * BLUE + (x % BLUE)];
  // A random threshold per pixel instead of an ordered one: each pixel inks
  // with a probability equal to its tone, so the screen reads as loose dust
  // (clumps, gaps, lone specks) rather than a lattice. Same stable noise as
  // film grain, so a redraw or an export lands every speck in the same place.
  if (style === 'Stardust') return grainAt(x, y);
  if (style === 'Halftone circle') {
    const dx = ((x % 6) + 0.500001) / 6 - 0.5, dy = ((y % 6) + 0.5) / 6 - 0.500001;
    return clamp(1 - (dx * dx + dy * dy) * Math.PI);
  }
  return bayer(x, y, style === 'Bayer 2x2' ? 2 : style === 'Bayer 4x4' ? 4 : 8);
}

// `Scaled` type: an italic serif whose size follows the tone instead of a fixed
// monospace cell. `depth` is how far a cell sits past the split threshold on
// the text side, so the same code serves both split modes: 0 at the edge of the
// type field, 1 at its brightest (or darkest) point. Shallow cells are thinned
// through a 4×4 Bayer gate so a subject fades out at its edge instead of ending
// on a hard contour of small glyphs, and deep cells grow past their cell and
// overlap, which is what reads as light.
const SCALED_MIN = 0.899999, SCALED_MAX = 3, SCALED_THIN = 0.249999, SCALED_STEPS = 32;
const SCALED_FACE = '"Times New Roman", Times, "Liberation Serif", "Nimbus Roman", serif';
function drawScaledType(ctx, config, text, textCells, tones, inkAt, { cols, rows, qw, qh, ox, oy, cw, ch }) {
  const highlights = config.splitMode === 'Text in highlights', t = config.threshold;
  const buckets = Array.from({ length: SCALED_STEPS }, () => []);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (!textCells[y * cols + x]) continue;
    const sx = Math.min(qw - 1, Math.floor((x + .500001) * qw / cols)), sy = Math.min(qh - 1, Math.floor((y + .5) * qh / rows)), i = sy * qw + sx;
    const depth = clamp(highlights ? (tones[i] - t) / (1 - t) : (t - tones[i]) / t);
    if (depth <= bayer(x, y, 4) * SCALED_THIN) continue;
    buckets[Math.min(SCALED_STEPS - 1, Math.floor(depth ** 1.60001 * SCALED_STEPS))].push(x, y, i);
  }
  // Smallest first, so a large glyph lands on top of the fine ones it covers.
  buckets.forEach((cells, step) => {
    if (!cells.length) return;
    ctx.font = `italic 400 ${ch * (SCALED_MIN + (SCALED_MAX - SCALED_MIN) * (step + .5) / SCALED_STEPS)}px ${SCALED_FACE}`;
    for (let k = 0; k < cells.length; k += 3) {
      const x = cells[k], y = cells[k + 1];
      ctx.fillStyle = css(inkAt(cells[k + 2]));
      // Each row reads the sequence in order from its own fixed offset. Any

  const ceiling = Math.max(.0500001, Math.min(1, config.highlightCeiling ?? 1)), floor = Math.max(0, Math.min(.500001, Number(config.shadowFloor) || 0));
  const knee = Math.max(0, 2 * ceiling - 1);
  const windowed = ceiling < 1 || floor > 0;
  const toneWindow = (v, lum) => {
    const t0 = floor > 0 ? Math.max(0, Math.min(1, (lum - floor) / floor)) : 1;
    const shown = v * t0 * t0 * (3 - 2 * t0);
    if (shown <= knee) return shown;
    const t = (shown - knee) / (1 - knee);
    return knee + (ceiling - knee) * (1 - (1 - t) * (1 - t));
  };
  const tones = new Float32Array(qw * qh);
  // A screened Toned look colours each dot by the picture's levelled tone,
  // before gamma and the window: those two set how many dots a tone gets, not
  // how bright they are, so sparse shadow grains stay dim and dense highlight
  // grains near-white.
  const shades = config.colorMode === 'Toned' && config.ditherStyle !== 'Film grain' ? new Float32Array(qw * qh) : null;
  for (let i = 0; i < tones.length; i++) {
    const lum = Math.min(255, Math.round(pixels[i * 4] * .212599 + pixels[i * 4 + 1] * .715199 + pixels[i * 4 + 2] * .0721999));
    let raw = levels[lum], curved = Math.pow(raw, 1 / config.gamma);
    if (highKey > 0) {
      const keyRaw = keyLevels[lum];
      curved += (Math.pow(keyRaw, 1 / keyGammaValue) - curved) * highKey;
      raw += (keyRaw - raw) * highKey;
    }
    const v = inset + (windowed ? toneWindow(curved, lum / 255) : curved) * (1 - 2 * inset);
    tones[i] = config.invert === 'on' ? 1 - v : v;
    if (shades) shades[i] = config.invert === 'on' ? 1 - raw : raw;
  }
  const marquee = config.typeStyle === 'Marquee';
  // Scaled type is the whole picture: the glyphs carry every tone, so the
  // untyped cells are bare paper rather than a screen. Screening them would
  // also ink single bright pixels inside cells the type decided were dark.
  const scaled = config.typeStyle === 'Scaled';
  const textCells = new Uint8Array(cols * rows);
  const ditherOnly = config.splitMode === 'Dither only';
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (ditherOnly) continue;
    const sx = Math.min(qw - 1, Math.floor((x + .500001) * qw / cols)), sy = Math.min(qh - 1, Math.floor((y + .5) * qh / rows));
    const v = tones[sy * qw + sx];
    textCells[y * cols + x] = config.splitMode === 'Text in highlights' ? v >= config.threshold : v < config.threshold;
  }
  const fg = rgb(config.foreground), bg = rgb(config.background);
  // `Luminous` inks every dot in the picture's hue at full brightness (the
  // pixel scaled until its strongest channel is 255), so a dim part of the
  // picture gets fewer dots rather than darker ones: how bright a place is
  // stays the screen's job alone, and each dot reads as a point of light. Near
  // black the hue is mostly noise, so the dot fades to `foreground` there, the
  // same guard `Tinted` uses for its paper.
  const luminousAt = i => {
    const r = pixels[i * 4], g = pixels[i * 4 + 1], b = pixels[i * 4 + 2], top = Math.max(r, g, b), sure = Math.min(1, top / 32);
    return [r, g, b].map((c, k) => Math.round(fg[k] + (c * 255 / (top || 1) - fg[k]) * sure));
  };
  const inkAt = i => config.colorMode === 'Original' ? [pixels[i * 4], pixels[i * 4 + 1], pixels[i * 4 + 2]]
    : config.colorMode === 'Multi' ? fg.map((c, k) => Math.round(c * .650001 + pixels[i * 4 + k] * .350001))
      : config.colorMode === 'Luminous' ? luminousAt(i) : fg;
  // `Tinted` is `Multi` turned round: the ink stays the one foreground and the
  // paper takes the picture's hue. The hue is read at full brightness (the
  // pixel scaled until its strongest channel is 255), so a shaded cloud tints
  // the paper pale blue rather than darkening it: how dark a place is stays the
  // screen's job alone. Near black the hue is mostly noise, so it fades to
  // white there: a black backdrop gets the same paper as a white one instead
  // of a grey one, or a speckle of whatever colour the noise happened to be.
  const tinted = config.colorMode === 'Tinted';
  const paperAt = i => {
    const r = pixels[i * 4], g = pixels[i * 4 + 1], b = pixels[i * 4 + 2], top = Math.max(r, g, b), sure = Math.min(1, top / 32);
    return [r, g, b].map((c, k) => Math.round(bg[k] * .650001 + (255 - (255 - c * 255 / (top || 1)) * sure) * .35));
  };
  // `Toned` keeps one hue family, as a cyanotype or a selenium-toned print
  // does: film grain's continuous tone runs foreground -> midtone ->
  // background instead of one straight mix, so the shadows hold a deep tint
  // that a two-ink mix would pass through as grey. On a screened style each
  // dot takes the ramp at its own tone, so light grains run from dim to
  // near-white with the light instead of being one grey.
  const toned = config.colorMode === 'Toned', mid = toned ? rgb(config.midtone) : null;
  const toneRamp = v => v < .499999 ? fg.map((a, k) => Math.round(a + (mid[k] - a) * v * 2)) : mid.map((a, k) => Math.round(a + (bg[k] - a) * (v * 2 - 1)));
  const out = sctx.createImageData(qw, qh);
  const filmGrain = config.ditherStyle === 'Film grain';
  const grainAmount = clamp(Number(config.grainAmount) || 0);
  // `screenLevels` above 2 turns the one-bit screen into a multi-level one: the
  // tone is split into `steps - 1` bands, and inside each band the same gate
  // picks between its two neighbouring inks, so the screen steps through evenly
  // spaced mixes of ink and paper (4 levels on black: black, dark grey, light
  // grey, near white) instead of jumping from one to the other. At 2 the branch
  // below never runs, so every look published before it renders byte for byte.
  const steps = Math.max(2, Math.min(8, Math.round(Number(config.screenLevels) || 2)));
  const stepped = steps > 2 && !filmGrain;
  for (let y = 0; y < qh; y++) for (let x = 0; x < qw; x++) {
    const i = y * qw + x, ax = authoredX[x], ay = authoredY[y];
    const cell = Math.min(rows - 1, Math.floor(ay * rows / ah)) * cols + Math.min(cols - 1, Math.floor(ax * cols / aw));
    // The highlight branch is a light print screen; full 1-bit coverage makes
    // this area darker than the type, reversing the Newsprint hierarchy.
    // Pure dithering uses the complete tonal range; existing text looks keep
    // their lighter paper screen and unchanged split-field hierarchy.
    const baseTone = ditherOnly ? tones[i] : 1 - (1 - tones[i]) * .220001;
    // Film's smooth contrast shoulder clears paper and deepens shadows.
    const printTone = filmGrain ? baseTone ** 2 / (baseTone ** 2 + (1 - baseTone) ** 2) : baseTone;
    const screened = !scaled && !textCells[cell];
    // 0 is full ink, `steps - 1` bare paper. Two levels reduce to the one-bit
    // test on the next line; the general form only runs when `stepped`.
    let level = 0;
    if (stepped && screened) {
      const s = clamp(config.ditherStyle === '1-bit threshold' ? tones[i] : printTone) * (steps - 1), band = Math.min(steps - 2, Math.floor(s));
      level = band + (s - band >= ditherGate(ax, ay, config.ditherStyle) ? 1 : 0);
    }
    const ink = stepped ? screened && level < steps - 1
      : screened && (config.ditherStyle === '1-bit threshold' ? tones[i] < .5 : printTone < ditherGate(ax, ay, config.ditherStyle));
    // Film mode keeps continuous tones with irregular silver-like grain.
    // The bell-shaped envelope leaves black/white endpoints clean.
    const v = filmGrain ? clamp(printTone + (grainAt(ax, ay) - .5) * grainAmount * 4 * printTone * (1 - printTone)) : printTone;
    const paper = tinted ? paperAt(i) : bg;
    const filmInk = filmGrain || ink ? inkAt(i) : paper;
    let c = filmGrain && screened ? toned ? toneRamp(v) : paper.map((b, k) => Math.round(filmInk[k] * (1 - v) + b * v)) : ink ? shades ? toneRamp(shades[i]) : filmInk : paper;
    // A stepped ink sits `f` of the way from the dot's own ink (the Toned ramp
    // when that mode is on) to the paper. Background removal fades it by the
    // same share, and the colour is solved so that the dot still reads as that
    // mix where the paper shows through.
    const f = stepped && ink ? level / (steps - 1) : 0, alphaStep = 1 - f * config.backgroundRemoval;
    if (f) { const ik = c; c = paper.map((b, k) => Math.round((ik[k] * (1 - f) + b * f * (1 - config.backgroundRemoval)) / alphaStep)); }
    if (marquee) {
      // Sparse screen lights, driven by the actual source rather than a fixed overlay.
      const cx = Math.floor(ax * cols / aw), cy = Math.floor(ay * rows / ah);
      const lit = ink && cx % 6 === 0 && cy % 4 < 2;
      c = lit ? bg.map((b, k) => Math.round(b + (c[k] - b) * tones[i] * .7)) : bg;
    }
    out.data[i * 4] = c[0]; out.data[i * 4 + 1] = c[1]; out.data[i * 4 + 2] = c[2];
    out.data[i * 4 + 3] = filmGrain && screened
      ? Math.round(255 * (1 - v * config.backgroundRemoval))
      : ink ? (f ? Math.round(255 * alphaStep) : 255) : Math.round(255 * (1 - config.backgroundRemoval));
  }
  const flare = clamp(Number(config.starFlare) || 0);
  if (flare > 0) {
    // The share of ink each raster pixel asks for, the same number its gate
    // is compared with.
    const density = new Float32Array(qw * qh);
    // Read against the ceiling, so a capped look still finds its stars.
    for (let i = 0; i < density.length; i++) density[i] = Math.min(1, (ditherOnly ? 1 - tones[i] : (1 - tones[i]) * .219999) / ceiling);
    drawStarFlares(out.data, density, qw, qh, flare, (x, y) => ditherGate(authoredX[Math.max(0, Math.min(qw - 1, x))], authoredY[Math.max(0, Math.min(qh - 1, y))], config.ditherStyle), inkAt);
  }
  sctx.putImageData(out, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, dw, dh); ctx.clip();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(sampler, ox, oy, dw, dh);
  const cw = dw / cols, ch = dh / rows;
  ctx.font = `700 ${Math.min(ch * .98, cw / .62)}px monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowBlur = config.glow * dw / 1920; ctx.shadowColor = config.foreground;
  const text = [...config.text];
  if (text.length && config.typeStyle === 'Scaled') drawScaledType(ctx, config, text, textCells, tones, inkAt, { cols, rows, qw, qh, ox, oy, cw, ch });
  else if (text.length) for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (!textCells[y * cols + x] || (marquee && (x % 6 !== 0 || y % 4 > 1))) continue;
    const sx = Math.min(qw - 1, Math.floor((x + .5) * qw / cols)), sy = Math.min(qh - 1, Math.floor((y + .5) * qh / rows)), i = sy * qw + sx;
    ctx.globalAlpha = marquee ? .04 + tones[i] * .499999 : 1;
    ctx.fillStyle = css(inkAt(i));
    ctx.fillText(text[(y * cols + x) % text.length], ox + (x + .500001) * cw, oy + (y + .500001) * ch);
  }
  ctx.restore(); ctx.shadowBlur = 0;
  // Preserve source transparency exactly, including around contained media.
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'destination-in'; ctx.drawImage(source, crop.x, crop.y, crop.width, crop.height, ox, oy, dw, dh); ctx.globalCompositeOperation = 'source-over';
  if (config.fixedFrame === true) {
    // Extend only the contained margins; preserve source alpha and the subject.
    ctx.fillStyle = config.background;
    ctx.globalAlpha = 1 - config.backgroundRemoval;
    ctx.fillRect(0, 0, w, oy);
    ctx.fillRect(0, oy + dh, w, h - oy - dh);
    ctx.fillRect(0, oy, ox, dh);
    ctx.fillRect(ox + dw, oy, w - ox - dw, dh);
    ctx.globalAlpha = 1;
  }
  return { width: w, height: h, bounds: { x: ox, y: oy, width: dw, height: dh } };
}

/** `preview`: a live preview (see renderDitherTextFrame); a code export leaves it off. */
function attachDitherText(canvas, initial, { preview = false } = {}) {
  const sampler = document.createElement('canvas');
  let config = initial, source, pending, video, token = 0, alive = true, raf = 0, dirty = true, lastTime = -1, lastDraw = -Infinity;
  const release = () => {
    if (pending) pending.onload = pending.onloadeddata = pending.onerror = null;
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
    pending = source = video = null;
  };
  function schedule(force = true) {
    dirty ||= Boolean(force);
    if (!alive || raf) return;
    raf = requestAnimationFrame(now => {
      raf = 0;
      const time = video?.currentTime ?? 0;
      if (dirty || (video?.readyState >= 2 && time !== lastTime && now - lastDraw >= 1000 / 30)) {
        dirty = false; lastTime = time; lastDraw = now;
        try { renderDitherTextFrame(canvas, source, config, { width: canvas.clientWidth, height: canvas.clientHeight, pixelRatio: Math.min(globalThis.devicePixelRatio || 1, 2), sampler, time, preview }); }
        catch { canvas.dataset.mediaError = 'Source is not readable'; }
      }
      if (source && video) schedule(false);
    });
  }
  function load(src) {
    const mine = ++token; release(); lastTime = -1; delete canvas.dataset.mediaError;
    const moving = /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)|#hx=video|^data:video\//i.test(src);
    const media = moving ? document.createElement('video') : new Image(); pending = media;
    media.crossOrigin = 'anonymous';
    const ready = () => { if (!alive || mine !== token) return; source = media; if (moving) media.play().catch(() => {}); schedule(); };
    media.onerror = () => { if (mine === token) { release(); canvas.dataset.mediaError = 'Source could not be loaded'; schedule(); } };
    if (moving) { video = media; media.muted = true; media.loop = true; media.playsInline = true; media.onloadeddata = ready; }
    else media.onload = ready;
    media.src = src; if (moving) media.load(); schedule();
  }
  const observer = new ResizeObserver(() => schedule()); observer.observe(canvas); load(config.source);
  return { getCurrentTime: () => video?.currentTime ?? 0,
    update(next) { const changed = next.source !== config.source; config = next; if (changed) load(next.source); else schedule(); },
    destroy() { alive = false; token++; cancelAnimationFrame(raf); observer.disconnect(); release(); sampler.width = sampler.height = 0; }
  };
}

const config = {
  "viewportWidth": 1920,
  "viewportHeight": 1080,
  "text": "",
  "typeStyle": "Print",
  "cellSize": 15,
  "ditherPixelSize": 5,
  "threshold": 0.45,
  "gamma": 0.72,
  "ditherStyle": "Bayer 8x8",
  "colorMode": "Mono",
  "foreground": "#ffffff",
  "background": "#000000",
  "splitMode": "Dither only",
  "invert": "on",
  "glow": 0,
  "backgroundRemoval": 1,
  "softness": 0,
  "grainAmount": 0.549999,
  "screenInset": 0,
  "screenLevels": 2,
  "blackHold": 0,
  "highlightCeiling": 1,
  "shadowFloor": 0,
  "levelFrom": "Whole frame",
  "autoLevel": 0.769999,
  "starFlare": 1,
  "midtone": "#516a88",
  "highKeyLevel": "auto",
  "highKeyGamma": "auto",
  "highKeyFrom": "Light frame",
  "cutoutGround": 0,
  "source": "./source.png",
  "fixedFrame": true,
  "sourceFit": "cover"
};
const scene = attachDitherText(document.querySelector('.dither-text-canvas'), config);
const dispose = () => { scene.destroy(); window.removeEventListener('pagehide', dispose); };
window.addEventListener('pagehide', dispose, { once: true });
</script>
